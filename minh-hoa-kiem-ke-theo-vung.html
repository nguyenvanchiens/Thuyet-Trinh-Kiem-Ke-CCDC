<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Minh hoạ kiểm kê theo vùng</title>
<style>
:root{
  --bg:#f5f6f8; --surface:#fff; --muted-bg:#f1f3f6; --text:#1b2130; --muted:#667085; --border:#e3e6ec;
  --primary:#2457c5; --primary-soft:#e8eefc; --ok:#1e7a46; --ok-soft:#e3f4ea; --warn:#9a6200; --warn-soft:#fdf1dc;
  --bad:#c0362c; --bad-soft:#fdeceb; --radius:8px;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
body{margin:0;background:var(--bg);color:var(--text);font:13px/1.5 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
.demo{background:#fff7e0;border-bottom:1px solid #f0dca8;color:#7a5a00;padding:6px 16px;font-size:12px;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:center}
.demo select{height:26px;border:1px solid #e2c77a;border-radius:6px;background:#fff;padding:0 6px;max-width:100%}
.demo a{color:#7a5a00}
.shell{display:grid;grid-template-columns:210px 1fr;min-height:calc(100vh - 39px)}
aside{background:#141b2d;color:#c9d1e3;padding:14px 10px}
aside .brand{color:#fff;font-weight:700;font-size:14px;padding:4px 10px 14px}
aside .grp{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:#7d879c;padding:10px 10px 4px}
aside a{display:flex;justify-content:space-between;align-items:center;color:inherit;text-decoration:none;padding:6px 10px;border-radius:6px;cursor:pointer}
aside a:hover{background:#1c2540}
aside a.on{background:#24304d;color:#fff;font-weight:600}
aside .badge{background:var(--bad);color:#fff;border-radius:999px;font-size:11px;padding:0 6px}
.mnav{display:none}
.shell > div{min-width:0}
main{padding:16px 20px 60px;min-width:0}
.crumb{color:var(--muted);font-size:12px;margin-bottom:6px}
.crumb a{color:var(--primary);cursor:pointer}
.head{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:12px}
h1{font-size:18px;margin:0;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
h3{font-size:13px;margin:16px 0 8px}
.btn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:var(--radius);border:1px solid var(--border);background:var(--surface);cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--muted-bg)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.primary:hover,.btn.ok:hover,.btn.danger:hover{filter:brightness(1.08)}
.btn.sm{height:26px;padding:0 9px;font-size:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:10px}
.pad{padding:14px 16px}
.filters{display:flex;flex-wrap:wrap;gap:8px;padding:10px 12px;border-bottom:1px solid var(--border);align-items:flex-end}
.filters .f{display:flex;flex-direction:column;gap:2px;min-width:150px}
.lbl{font-size:12px;color:var(--muted)}
.input,select.input{height:32px;width:100%;border:1px solid var(--border);border-radius:var(--radius);background:#fff;padding:0 10px;outline:none}
textarea.input{height:60px;padding:6px 10px;resize:vertical;width:100%;border:1px solid var(--border);border-radius:var(--radius)}
.input:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.tblwrap{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--border);white-space:nowrap;vertical-align:top}
td.wrap{white-space:normal;min-width:160px}
th{font-size:12px;color:var(--muted);font-weight:600;background:var(--muted-bg)}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:#fafbfd}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.mono{font-family:Consolas,"Cascadia Mono",monospace}
.pill{display:inline-block;font-size:11px;font-weight:600;padding:1px 8px;border-radius:999px;white-space:nowrap}
.p-ok{background:var(--ok-soft);color:var(--ok)} .p-warn{background:var(--warn-soft);color:var(--warn)}
.p-info{background:var(--primary-soft);color:var(--primary)} .p-mute{background:var(--muted-bg);color:var(--muted)}
.p-bad{background:var(--bad-soft);color:var(--bad)}
.note{font-size:12px;color:var(--muted);margin-top:10px}
.foot{padding:8px 12px;font-size:12px;color:var(--muted);border-top:1px solid var(--border);background:#fbfcfd}
.alert{border-radius:var(--radius);padding:8px 12px;margin-bottom:12px;font-size:12px}
.alert.bad{background:var(--bad-soft);color:var(--bad)} .alert.info{background:var(--primary-soft);color:#1d3f8f}
.alert.warn{background:var(--warn-soft);color:var(--warn)} .alert.ok{background:var(--ok-soft);color:var(--ok)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:14px}
.stat{border:1px solid var(--border);border-radius:10px;padding:10px 12px;background:var(--surface)}
.stat .n{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.stat .t{font-size:12px;color:var(--muted)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);padding:0 8px;overflow-x:auto}
.tab{border:0;background:none;padding:10px 12px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tab.on{color:var(--primary);border-bottom-color:var(--primary);font-weight:600}
.tab .c{font-size:11px;background:var(--muted-bg);border-radius:999px;padding:0 6px;margin-left:4px}
.guide{border:1px dashed #e2c77a;background:#fffcf2;border-radius:10px;margin-bottom:14px}
.guide summary{cursor:pointer;padding:10px 14px;font-weight:600;color:#7a5a00}
.guide ol{margin:0;padding:0 14px 12px 34px}
.guide li{margin:3px 0}
.bar{height:6px;border-radius:3px;background:var(--muted-bg);overflow:hidden;width:80px;display:inline-block;vertical-align:middle;margin-right:6px}
.bar i{display:block;height:100%;background:var(--primary)}
.link{color:var(--primary);cursor:pointer;background:none;border:0;padding:0;text-decoration:underline}
/* kiểm vùng (màn app) */
.phone{max-width:430px;margin:0 auto;background:var(--surface);border:1px solid var(--border);border-radius:18px;overflow:hidden;box-shadow:0 6px 24px rgba(20,30,50,.08)}
.ph-top{background:var(--primary);color:#fff;padding:12px 14px}
.ph-top .t{font-weight:700;font-size:15px}
.ph-top .s{font-size:12px;opacity:.85}
.ph-body{padding:12px 14px}
.scan{display:flex;gap:6px}
.scan .input{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 4px}
.chip{border:1px dashed var(--border);background:var(--muted-bg);border-radius:999px;padding:2px 10px;font-size:12px;cursor:pointer}
.chip:hover{border-color:var(--primary)}
.item{display:flex;justify-content:space-between;gap:8px;border:1px solid var(--border);border-radius:8px;padding:8px 10px;margin:6px 0;background:#fff}
.item .m{font-weight:600}
.item .d{font-size:12px;color:var(--muted)}
.item .x{border:0;background:none;color:var(--muted);font-size:18px;cursor:pointer;line-height:1}
.ph-foot{display:flex;gap:8px;padding:12px 14px;border-top:1px solid var(--border);background:#fbfcfd}
.ph-foot .btn{flex:1;justify-content:center}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:8px;overflow:hidden}
.seg button{border:0;background:#fff;padding:3px 10px;cursor:pointer;font-size:12px}
.seg button.on{background:var(--primary);color:#fff}
.seg button.on.khong{background:var(--bad)}
/* dialog */
.overlay{position:fixed;inset:0;background:rgba(15,20,35,.45);display:none;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto;z-index:10}
.overlay.open{display:flex}
.dlg{background:var(--surface);border-radius:12px;width:min(560px,100%);box-shadow:0 20px 50px rgba(0,0,0,.25)}
.dlg header{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;gap:10px}
.dlg header h2{font-size:15px;margin:0}
.dlg .body{padding:16px 18px}
.dlg footer{padding:12px 18px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.x{border:0;background:none;font-size:20px;line-height:1;cursor:pointer;color:var(--muted)}
.wlist{list-style:none;margin:0;padding:0}
.wlist li{border-left:3px solid var(--warn);background:var(--warn-soft);border-radius:6px;padding:8px 10px;margin:6px 0}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#1b2130;color:#fff;padding:8px 14px;border-radius:8px;font-size:12px;z-index:20;max-width:90vw}
.ms{position:relative;display:inline-block}
.ms summary{list-style:none;cursor:pointer;height:32px;display:flex;align-items:center;border:1px solid var(--border);border-radius:var(--radius);padding:0 10px;background:#fff;min-width:180px}
.ms summary::-webkit-details-marker{display:none}
.ms .box{position:absolute;z-index:5;background:#fff;border:1px solid var(--border);border-radius:8px;padding:6px;margin-top:4px;min-width:240px;box-shadow:0 8px 20px rgba(0,0,0,.1)}
.ms label{display:flex;gap:6px;align-items:center;padding:4px 6px;white-space:nowrap}
/* app mobile */
.app-wrap{display:grid;grid-template-columns:380px minmax(0,1fr);gap:20px;align-items:start}
.dt{width:360px;max-width:100%;height:740px;border:10px solid #1b2130;border-radius:36px;background:#f5f6f8;overflow:hidden;display:flex;flex-direction:column;position:relative;box-shadow:0 18px 40px rgba(20,30,50,.18);margin:0 auto}
.dt-status{flex:0 0 24px;display:flex;justify-content:space-between;align-items:center;padding:0 16px;font-size:11px;color:#fff;background:#1d48a8}
.dt-top{flex:0 0 auto;background:var(--primary);color:#fff;padding:8px 12px 10px;display:flex;align-items:center;gap:8px;min-height:52px}
.dt-top .bk{border:0;background:rgba(255,255,255,.18);color:#fff;width:30px;height:30px;border-radius:8px;cursor:pointer;font-size:18px;line-height:1;flex:0 0 30px}
.dt-top b{display:block;font-size:14px;line-height:1.3}
.dt-top small{display:block;opacity:.85;font-size:11px}
.dt-body{flex:1;overflow-y:auto;min-height:0}
.dt-foot{flex:0 0 auto;padding:10px 12px;border-top:1px solid var(--border);background:#fff;display:flex;flex-direction:column;gap:6px}
.dt-foot.two{flex-direction:row}
.dt-h{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:12px 12px 4px}
.dt-row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 12px;background:#fff;border-bottom:1px solid var(--border)}
.dt-row[data-act]{cursor:pointer}
.dt-row[data-act]:hover{background:#fafbfd}
.dt-row > div:first-child{min-width:0}
.dt-row .r{text-align:right;flex:0 0 auto}
.dt-sub{font-size:11px;color:var(--muted)}
.dt-row .seg{flex:0 0 auto}
.seg button{white-space:nowrap}
.dt-row .pill{white-space:normal}
.dt-note{padding:8px 12px;font-size:12px;color:var(--muted)}
.dt-loc{display:flex;gap:6px;padding:8px 10px;background:#fff;border-bottom:1px solid var(--border)}
.dt-loc input{flex:1;min-width:0}
.dt-tabs{display:flex;background:#fff;border-bottom:1px solid var(--border)}
.dt-tabs button{flex:1;border:0;background:none;padding:10px 6px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;font-weight:600}
.dt-tabs button.on{color:var(--primary);border-bottom-color:var(--primary)}
.ph-btn{min-height:40px;border-radius:10px;border:1px solid var(--border);background:#fff;font-weight:600;cursor:pointer;width:100%;padding:0 10px}
.ph-btn:hover{background:var(--muted-bg)}
.ph-btn.pri{background:var(--primary);border-color:var(--primary);color:#fff}
.ph-btn.okb{background:var(--ok);border-color:var(--ok);color:#fff}
.ph-btn:disabled{opacity:.5;cursor:not-allowed}
.ph-btn.on{background:var(--primary);border-color:var(--primary);color:#fff}
.ph-btn.on.hong{background:var(--bad);border-color:var(--bad)}
.tt-ds{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.tt-ds .ph-btn{min-height:36px;font-size:12px}
.ph-card{border-radius:10px;padding:8px 10px;font-size:12px}
.ph-card.bad{background:var(--bad-soft);color:var(--bad)}
.ck-l{display:flex;gap:8px;align-items:center;font-size:12px}
.dt-info{font-size:12px;color:var(--muted);line-height:1.6}
.cam{height:150px;background:#0f1420;border-radius:12px;margin:10px;position:relative;display:grid;place-items:center;color:#8b95a8;font-size:12px;overflow:hidden}
.cam::before{content:"";position:absolute;inset:24px 60px;border:2px solid rgba(255,255,255,.55);border-radius:10px}
.cam::after{content:"";position:absolute;left:60px;right:60px;height:2px;background:#ff5a4f;top:26px;animation:quet 1.6s ease-in-out infinite alternate}
@keyframes quet{to{top:122px}}
@media (prefers-reduced-motion:reduce){.cam::after{animation:none;top:75px}}
.tem-ds{display:flex;flex-wrap:wrap;gap:6px;padding:0 10px}
.tem{border:1px dashed #9aa3b5;background:#fff;border-radius:8px;padding:6px 9px;cursor:pointer;text-align:left;font-size:12px;line-height:1.3}
.tem:hover{border-color:var(--primary)}
.ph-sheet{position:absolute;inset:0;background:rgba(15,20,35,.45);display:flex;align-items:flex-end;z-index:2}
.ph-sheet .in{background:#fff;border-radius:16px 16px 0 0;padding:14px 14px 16px;width:100%;display:flex;flex-direction:column;gap:6px;max-height:88%;overflow-y:auto}
.ph-sheet ul{margin:0;padding-left:18px}
@media (max-width:1000px){ .app-wrap{grid-template-columns:1fr} }
@media (max-width:760px){
  .shell{grid-template-columns:1fr}
  aside{display:none}
  .mnav{display:block;padding:10px 12px 0}
  main{padding:12px 12px 60px}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .filters .f{min-width:0;flex:1 1 140px}
}
</style>
</head>

<div class="demo">
  <span><b>Màn minh hoạ</b> · dữ liệu giả · luồng họp 19/11</span>

    <select id="vai" aria-label="Đổi người đăng nhập"></select>
  </label>
  <button class="btn sm" id="btnReset" type="button">Làm lại từ đầu</button>

</div>
<div class="shell">
  <aside>
    <div class="brand">Fastlink ERP · CCDC</div>

    <div class="grp">Mobile</div>

  <div>
    <div class="mnav"><select class="input" id="mnav" aria-label="Menu">
      <option value="ccdc">Công cụ dụng cụ</option><option value="dot">Đợt kiểm kê</option>
      <option value="cuatoi">Kiểm kê của tôi</option><option value="phieu">Phiếu duyệt của tôi</option><option value="bc">Báo cáo kiểm kê</option><option value="app">App kiểm kê (mobile)</option>
    </select></div>
    <main id="main"></main>
  </div>
</div>
<div class="overlay" id="ov"><div class="dlg" role="dialog" aria-modal="true">
  <header><h2 id="dTitle"></h2><button class="x" data-act="dong-dlg" aria-label="Đóng">×</button></header>
  <div class="body" id="dBody"></div>
  <footer id="dFoot"></footer>
</div></div>
<div class="toast" id="toast" hidden></div>

// ---- luật dùng chung cho web và app ----
function kiemMa(d, z, ma) {
  ma = (ma || '').trim().toUpperCase(); if (!ma) return { loi: '' };
  const t = S.TS[ma];
  if (!t) return { ma, loi: 'Không tìm thấy mã ' + ma + ' trên hệ thống.' };
  if (d.vung[z].mon.some(x => x.ma === ma)) return { ma, loi: ma + ' đã có trong vùng này.' };
  const cb = [];
  if (t.loai === 'rieng') cb.push({ loai: 'rieng', nd: 'Đây là đồ riêng của ' + ten(t.giu) + '. Món vẫn nằm trong phần kiểm của ' + ten(t.giu) + '.' });
  if (t.cty !== d.cty) cb.push({ loai: 'cty', nd: 'Món này thuộc công ty ' + t.cty + ', đợt đang kiểm là ' + d.cty + '.' });
  const kia = vungCuaMonTrongDot(d, ma, z);
  if (kia) cb.push({ loai: 'vung', nd: 'Món này đang được kiểm ở vùng ' + VUNG[kia].ten + ' trong cùng đợt.' });
  return { ma, t, cb };
}
function luuMon(d, z, ma, cb, ai) {
  const v = d.vung[z];
  v.mon.push({ ma, cb, nguoi: ai, luc: gio(), tt: 'Tốt đang dùng', anh: false, tem: false, ghi: '' }); v.tt = 'dang'; v.nguoi = v.nguoi || ai;
  cb.forEach(c => S.vet.push({ dot: d.id, ma, vung: z, loai: c.loai, nd: c.nd, nguoi: ai, luc: gio() }));
}
function boMon(d, z, ma) {
  const v = d.vung[z]; v.mon = v.mon.filter(x => x.ma !== ma);
  S.vet = S.vet.filter(x => !(x.dot === d.id && x.vung === z && x.ma === ma)); if (!v.mon.length) v.tt = 'chua';
}
function nhomPhieu(d, z) {
  const g = {}; d.vung[z].mon.forEach(x => { const t = S.TS[x.ma], k = qlCua(t) || '__khong__' + t.cty; (g[k] = g[k] || []).push(x.ma); }); return g;
}
function xemPhieu(d, z) {

}
function chotLuat(d, z, ai) {
  const v = d.vung[z], g = nhomPhieu(d, z);
  Object.entries(g).forEach(([k, mons]) => S.phieu.push({ id: 'XN' + String(++S.seq).padStart(4, '0'), dot: d.id, loai: 'vung', vung: z, ai: k.startsWith('__khong__') ? null : k, mon: mons, tt: 'cho', bo: {} }));
  v.tt = 'chot'; v.chot = gio(); v.nguoi = v.nguoi || ai;

}
function xnPhieuLuat(p) {

}
const TT = ['Tốt đang dùng', 'Tốt không dùng', 'Chờ thanh lý', 'Hỏng'];
const ttPill = tt => !tt ? '' : tt === 'Hỏng' ? '<span class="pill p-bad">Hỏng</span>' : tt === 'Tốt đang dùng' ? '<span class="pill p-ok">Tốt đang dùng</span>' : `<span class="pill p-warn">${tt}</span>`;

function monCt(p, ma) { return p.loai === 'vung' ? (dotById(p.dot).vung[p.vung].mon.find(x => x.ma === ma) || {}) : ((p.ct || {})[ma] || {}); }

      const biBo = S.phieu.some(p => p.dot === d.id && p.bo[t.ma] !== undefined && p.tt === 'xn');

    case 'quet-nv': return quetNv($('scanNv').value);
    case 'luu-nv': toast('Đã lưu kết quả của ' + ten(S.nv) + '. Vào lại vẫn kiểm tiếp được.'); return di('chitiet', { tab: 'nv' });
    case 'nv-xn': { const id = xongNvLuat(dotById(S.dot), S.nv, S.vai); toast('Đã gửi phiếu ' + id + ' cho ' + ten(S.nv) + ' xác nhận.'); return di('chitiet', { tab: 'nv' }); }
    case 'mo-phieu': return di('chitietphieu', { phieu_: ds.phieu });
    case 'phieu-xn': return phieuXn();
    case 'bc-tab': S.bc.bcTab = ds.tab; return ve();
    case 'a-go': return aDi({ man: ds.man, dot: ds.dot || S.app.dot, vung: ds.vung || S.app.vung, nv: ds.nv || S.app.nv, phieu: ds.phieu || S.app.phieu });
    case 'a-lui': return aDi({ man: APP_LUI[S.app.man] });
    case 'a-quet': return aThem(ds.ma);
    case 'a-them': return aThem($('aScan').value);
    case 'a-cb-ok': { const a = S.app, r = a.sheet.r; luuMon(dotById(a.dot), a.vung, r.ma, r.cb, a.tk); a.sheet = null; toast('Đã thêm ' + r.ma + ' (đã lưu vết cảnh báo)'); return ve(); }
    case 'a-sheet-huy': S.app.sheet = null; return ve();
    case 'a-bo': boMon(dotById(S.app.dot), S.app.vung, ds.ma); S.app.sheet = null; toast('Đã bỏ ' + ds.ma + ' khỏi vùng'); return ve();
    case 'a-luu': toast('Đã lưu ' + dotById(S.app.dot).vung[S.app.vung].mon.length + ' món. Vào lại vẫn kiểm tiếp được.'); return aDi({ man: 'dot' });
    case 'a-tab': S.app.tab = ds.tab; return ve();
    case 'a-chon': S.app.man = 'kiem'; return aThem(ds.ma);
    case 'a-mon': { const x = dotById(S.app.dot).vung[S.app.vung].mon.find(m => m.ma === ds.ma); S.app.sheet = { loai: 'mon', ma: ds.ma, tt: x.tt || 'Tốt đang dùng', anh: !!x.anh, tem: !!x.tem, ghi: x.ghi || '' }; return ve(); }
    case 'a-tt': S.app.sheet.tt = ds.tt; return ve();
    case 'a-chup': S.app.sheet.anh = true; toast('Đã chụp 1 ảnh (giả lập).'); return ve();
    case 'a-luu-mon': { const sh = S.app.sheet, x = dotById(S.app.dot).vung[S.app.vung].mon.find(m => m.ma === sh.ma); if (sh.tt === 'Hỏng' && !sh.anh) return toast('Hỏng thì phải chụp ảnh.'); Object.assign(x, { tt: sh.tt, anh: sh.tt === 'Hỏng' ? true : sh.anh, tem: sh.tem, ghi: sh.ghi }); S.app.sheet = null; toast('Đã lưu ' + sh.ma + ': ' + sh.tt); return ve(); }
    case 'a-monnv': { const r = dotById(S.app.dot).nv[S.app.nv], c = (r.ct || {})[ds.ma] || {}; S.app.sheet = { loai: 'monnv', ma: ds.ma, kq: r.kq[ds.ma] || '', tt: c.tt || (r.kq[ds.ma] === 'co' ? 'Tốt đang dùng' : ''), anh: !!c.anh, tem: !!c.tem, ghi: c.ghi || '' }; return ve(); }
    case 'a-nvkq': Object.assign(S.app.sheet, { kq: ds.kq, tt: ds.tt }); return ve();
    case 'a-luu-monnv': { const sh = S.app.sheet; if (sh.kq === 'co' && sh.tt === 'Hỏng' && !sh.anh) return toast('Hỏng thì phải chụp ảnh.'); kqNvLuat(dotById(S.app.dot), S.app.nv, sh.ma, sh.kq, S.app.tk, sh.kq === 'co' ? { tt: sh.tt, anh: sh.anh, tem: sh.tem, ghi: sh.ghi } : { ghi: sh.ghi }); S.app.sheet = null; toast('Đã lưu ' + sh.ma); return ve(); }
    case 'a-quet-nv': return aQuetNv(ds.ma);
    case 'a-luu-nv': toast('Đã lưu kết quả của ' + ten(S.app.nv) + '.'); return aDi({ man: 'dot' });
    case 'a-nvxn-ok': { const id = xongNvLuat(dotById(S.app.dot), S.app.nv, S.app.tk); toast('Đã gửi phiếu ' + id + ' cho ' + ten(S.app.nv) + '.'); return aDi({ man: 'dot' }); }
    case 'a-chot': S.app.sheet = { loai: 'chot' }; return ve();
    case 'a-chot-ok': { const n = chotLuat(dotById(S.app.dot), S.app.vung, S.app.tk); toast(n ? 'Đã chốt, sinh ' + n + ' phiếu.' : 'Đã chốt vùng trống, không sinh phiếu.'); return aDi({ man: 'dot' }); }
    case 'a-kq': kqNvLuat(dotById(S.app.dot), S.app.nv, ds.ma, ds.kq, S.app.tk); return ve();
    case 'a-nvxn': S.app.sheet = { loai: 'nv' }; return ve();
    case 'a-xn': { const p = S.phieu.find(x => x.id === S.app.phieu), loi = xnPhieuLuat(p); if (loi) return toast(loi); toast('Đã xác nhận ' + p.id + '.'); return ve(); }
  }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'vai') { S.vai = t.value; if (['kiemnv', 'chitietphieu'].includes(S.view)) S.view = S.vai === 'thu' ? 'dot' : 'phieu'; return ve(); }
  if (t.id === 'mnav') return di(t.value);
  if (t.id === 'appTk') { S.app.tk = t.value; return aDi({ man: 'home' }); }
  if (t.id === 'aLoc') { S.app.loc = t.value; return ve(); }
  if (t.id === 'aLocNv') { S.app.locNv = t.value; return ve(); }
  if (t.id === 'aLocMon') { S.app.locMon = t.value; return ve(); }
  if (t.id === 'aTem') { S.app.sheet.tem = t.checked; return; }
  if (t.dataset.ady) { const p = S.phieu.find(x => x.id === S.app.phieu); if (t.checked) delete p.bo[t.dataset.ady]; else p.bo[t.dataset.ady] = ''; return ve(); }
  if (t.id === 'tdCty') return xemTaoDot();
  if (t.dataset.ccdc) { S.ccdc[t.dataset.ccdc] = t.value; S.ccdc.chon.clear(); return ve(); }
  if (t.dataset.chon) { t.checked ? S.ccdc.chon.add(t.dataset.chon) : S.ccdc.chon.delete(t.dataset.chon); return ve(); }
  if (t.dataset.dy) { const p = S.phieu.find(x => x.id === S.phieu_); if (t.checked) delete p.bo[t.dataset.dy]; else p.bo[t.dataset.dy] = ''; return ve(); }
  if (t.dataset.bcdot) { const id = t.dataset.bcdot; S.bc.dot = t.checked ? [...S.bc.dot, id] : S.bc.dot.filter(x => x !== id); ve(); const d = document.querySelector('details.ms'); if (d) d.open = true; return; }
  if (t.dataset.bc) { S.bc[t.dataset.bc] = t.value; return ve(); }
});
document.addEventListener('input', e => { const t = e.target; if (t.id === 'aGhi' && S.app.sheet) S.app.sheet.ghi = t.value; if (t.id === 'aTim') { S.app.q = t.value; $('aKq').innerHTML = ketQuaTim(); } if (t.dataset.lydo) { S.phieu.find(x => x.id === S.phieu_).bo[t.dataset.lydo] = t.value; } if (t.dataset.alydo) { S.phieu.find(x => x.id === S.app.phieu).bo[t.dataset.alydo] = t.value; } });
document.addEventListener('keydown', e => { if (e.target.id === 'scan' && e.key === 'Enter') them(e.target.value); if (e.target.id === 'scanNv' && e.key === 'Enter') quetNv(e.target.value); if (e.target.id === 'aScan' && e.key === 'Enter') aThem(e.target.value); });
document.addEventListener('mousedown', e => { const d = document.querySelector('details.ms[open]'); if (d && !d.contains(e.target)) d.open = false; });
$('btnReset').addEventListener('click', () => { batDau(); $('vai').value = 'thu'; ve(); });
$('ov').addEventListener('click', e => { if (e.target.id === 'ov') dongDlg(); });

// ---------------- khởi động ----------------
batDau();
$('vai').innerHTML = Object.entries(NGUOI).map(([k, n]) => `<option value="${k}">${n.ten} · ${n.vai}</option>`).join('');
(() => {
  const q = new URLSearchParams(location.search), man = q.get('man'), vai = q.get('vai');
  if (vai && NGUOI[vai]) { S.vai = vai; $('vai').value = vai; }
  if (man === 'dot') S.view = 'dot';
  else if (man === 'chitiet') Object.assign(S, { view: 'chitiet', dot: 'KK0013', tab: q.get('tab') || 'vung' });
  else if (man === 'kiemvung') Object.assign(S, { view: 'kiemvung', dot: 'KK0013', vung: q.get('vung') || 'KHO_MB' });
  else if (man === 'cuatoi') S.view = 'cuatoi';
  else if (man === 'kiemnv') Object.assign(S, { view: 'kiemnv', dot: 'KK0013', nv: q.get('nv') || S.vai });
  else if (man === 'phieu') S.view = 'phieu';
  else if (man === 'bc') Object.assign(S, { view: 'bc' }), S.bc.bcTab = q.get('tab') || 'tq';
  else if (man === 'app') { S.view = 'app'; const tk = q.get('tk'); if (tk && NGUOI[tk]) S.app.tk = tk; const am = q.get('app'); if (am) Object.assign(S.app, { man: am, dot: q.get('dot') || 'KK0013', vung: q.get('vung') || 'T4_HOP', nv: q.get('nv') || 'ha', tab: q.get('tab') || 'vung', phieu: q.get('phieu') || 'XN0001' }); }
  ve();
})();
</script>
