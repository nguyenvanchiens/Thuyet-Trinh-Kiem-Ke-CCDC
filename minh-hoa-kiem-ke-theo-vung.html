<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Minh hoạ kiểm kê theo vùng</title>
<style>
:root{
  --bg:#f5f6f8; --surface:#fff; --muted-bg:#f1f3f6; --text:#1b2130; --muted:#667085; --border:#e3e6ec;
  --primary:#2457c5; --primary-soft:#e8eefc; --ok:#1e7a46; --ok-soft:#e3f4ea; --warn:#9a6200; --warn-soft:#fdf1dc;
  --bad:#c0362c; --bad-soft:#fdeceb; --radius:8px;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
body{margin:0;background:var(--bg);color:var(--text);font:13px/1.5 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
.demo{background:#fff7e0;border-bottom:1px solid #f0dca8;color:#7a5a00;padding:6px 16px;font-size:12px;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:center}
.demo select{height:26px;border:1px solid #e2c77a;border-radius:6px;background:#fff;padding:0 6px;max-width:100%}
.demo a{color:#7a5a00}
.shell{display:grid;grid-template-columns:210px 1fr;min-height:calc(100vh - 39px)}
aside{background:#141b2d;color:#c9d1e3;padding:14px 10px}
aside .brand{color:#fff;font-weight:700;font-size:14px;padding:4px 10px 14px}
aside .grp{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:#7d879c;padding:10px 10px 4px}
aside a{display:flex;justify-content:space-between;align-items:center;color:inherit;text-decoration:none;padding:6px 10px;border-radius:6px;cursor:pointer}
aside a:hover{background:#1c2540}
aside a.on{background:#24304d;color:#fff;font-weight:600}
aside .badge{background:var(--bad);color:#fff;border-radius:999px;font-size:11px;padding:0 6px}
.mnav{display:none}
.shell > div{min-width:0}
main{padding:16px 20px 60px;min-width:0}
.crumb{color:var(--muted);font-size:12px;margin-bottom:6px}
.crumb a{color:var(--primary);cursor:pointer}
.head{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:12px}
h1{font-size:18px;margin:0;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
h3{font-size:13px;margin:16px 0 8px}
.btn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:var(--radius);border:1px solid var(--border);background:var(--surface);cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--muted-bg)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.primary:hover,.btn.ok:hover,.btn.danger:hover{filter:brightness(1.08)}
.btn.sm{height:26px;padding:0 9px;font-size:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:10px}
.pad{padding:14px 16px}
.filters{display:flex;flex-wrap:wrap;gap:8px;padding:10px 12px;border-bottom:1px solid var(--border);align-items:flex-end}
.filters .f{display:flex;flex-direction:column;gap:2px;min-width:150px}
.lbl{font-size:12px;color:var(--muted)}
.input,select.input{height:32px;width:100%;border:1px solid var(--border);border-radius:var(--radius);background:#fff;padding:0 10px;outline:none}
textarea.input{height:60px;padding:6px 10px;resize:vertical;width:100%;border:1px solid var(--border);border-radius:var(--radius)}
.input:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.tblwrap{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--border);white-space:nowrap;vertical-align:top}
td.wrap{white-space:normal;min-width:160px}
th{font-size:12px;color:var(--muted);font-weight:600;background:var(--muted-bg)}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:#fafbfd}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.mono{font-family:Consolas,"Cascadia Mono",monospace}
.pill{display:inline-block;font-size:11px;font-weight:600;padding:1px 8px;border-radius:999px;white-space:nowrap}
.p-ok{background:var(--ok-soft);color:var(--ok)} .p-warn{background:var(--warn-soft);color:var(--warn)}
.p-info{background:var(--primary-soft);color:var(--primary)} .p-mute{background:var(--muted-bg);color:var(--muted)}
.p-bad{background:var(--bad-soft);color:var(--bad)}
.note{font-size:12px;color:var(--muted);margin-top:10px}
.foot{padding:8px 12px;font-size:12px;color:var(--muted);border-top:1px solid var(--border);background:#fbfcfd}
.alert{border-radius:var(--radius);padding:8px 12px;margin-bottom:12px;font-size:12px}
.alert.bad{background:var(--bad-soft);color:var(--bad)} .alert.info{background:var(--primary-soft);color:#1d3f8f}
.alert.warn{background:var(--warn-soft);color:var(--warn)} .alert.ok{background:var(--ok-soft);color:var(--ok)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:14px}
.stat{border:1px solid var(--border);border-radius:10px;padding:10px 12px;background:var(--surface)}
.stat .n{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.stat .t{font-size:12px;color:var(--muted)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);padding:0 8px;overflow-x:auto}
.tab{border:0;background:none;padding:10px 12px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tab.on{color:var(--primary);border-bottom-color:var(--primary);font-weight:600}
.tab .c{font-size:11px;background:var(--muted-bg);border-radius:999px;padding:0 6px;margin-left:4px}
.guide{border:1px dashed #e2c77a;background:#fffcf2;border-radius:10px;margin-bottom:14px}
.guide summary{cursor:pointer;padding:10px 14px;font-weight:600;color:#7a5a00}
.guide ol{margin:0;padding:0 14px 12px 34px}
.guide li{margin:3px 0}
.bar{height:6px;border-radius:3px;background:var(--muted-bg);overflow:hidden;width:80px;display:inline-block;vertical-align:middle;margin-right:6px}
.bar i{display:block;height:100%;background:var(--primary)}
.link{color:var(--primary);cursor:pointer;background:none;border:0;padding:0;text-decoration:underline}
/* kiểm vùng (màn app) */
.phone{max-width:430px;margin:0 auto;background:var(--surface);border:1px solid var(--border);border-radius:18px;overflow:hidden;box-shadow:0 6px 24px rgba(20,30,50,.08)}
.ph-top{background:var(--primary);color:#fff;padding:12px 14px}
.ph-top .t{font-weight:700;font-size:15px}
.ph-top .s{font-size:12px;opacity:.85}
.ph-body{padding:12px 14px}
.scan{display:flex;gap:6px}
.scan .input{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 4px}
.chip{border:1px dashed var(--border);background:var(--muted-bg);border-radius:999px;padding:2px 10px;font-size:12px;cursor:pointer}
.chip:hover{border-color:var(--primary)}
.item{display:flex;justify-content:space-between;gap:8px;border:1px solid var(--border);border-radius:8px;padding:8px 10px;margin:6px 0;background:#fff}
.item .m{font-weight:600}
.item .d{font-size:12px;color:var(--muted)}
.item .x{border:0;background:none;color:var(--muted);font-size:18px;cursor:pointer;line-height:1}
.ph-foot{display:flex;gap:8px;padding:12px 14px;border-top:1px solid var(--border);background:#fbfcfd}
.ph-foot .btn{flex:1;justify-content:center}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:8px;overflow:hidden}
.seg button{border:0;background:#fff;padding:3px 10px;cursor:pointer;font-size:12px}
.seg button.on{background:var(--primary);color:#fff}
.seg button.on.khong{background:var(--bad)}
/* dialog */
.overlay{position:fixed;inset:0;background:rgba(15,20,35,.45);display:none;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto;z-index:10}
.overlay.open{display:flex}
.dlg{background:var(--surface);border-radius:12px;width:min(560px,100%);box-shadow:0 20px 50px rgba(0,0,0,.25)}
.dlg header{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;gap:10px}
.dlg header h2{font-size:15px;margin:0}
.dlg .body{padding:16px 18px}
.dlg footer{padding:12px 18px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.x{border:0;background:none;font-size:20px;line-height:1;cursor:pointer;color:var(--muted)}
.wlist{list-style:none;margin:0;padding:0}
.wlist li{border-left:3px solid var(--warn);background:var(--warn-soft);border-radius:6px;padding:8px 10px;margin:6px 0}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#1b2130;color:#fff;padding:8px 14px;border-radius:8px;font-size:12px;z-index:20;max-width:90vw}
.ms{position:relative;display:inline-block}
.ms summary{list-style:none;cursor:pointer;height:32px;display:flex;align-items:center;border:1px solid var(--border);border-radius:var(--radius);padding:0 10px;background:#fff;min-width:180px}
.ms summary::-webkit-details-marker{display:none}
.ms .box{position:absolute;z-index:5;background:#fff;border:1px solid var(--border);border-radius:8px;padding:6px;margin-top:4px;min-width:240px;box-shadow:0 8px 20px rgba(0,0,0,.1)}
.ms label{display:flex;gap:6px;align-items:center;padding:4px 6px;white-space:nowrap}
@media (max-width:760px){
  .shell{grid-template-columns:1fr}
  aside{display:none}
  .mnav{display:block;padding:10px 12px 0}
  main{padding:12px 12px 60px}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .filters .f{min-width:0;flex:1 1 140px}
}
</style>
</head>
<body>
<div class="demo">
  <span><b>Màn minh hoạ</b> · dữ liệu giả · luồng họp 19/11</span>
  <label>Đang đăng nhập:
    <select id="vai" aria-label="Đổi người đăng nhập"></select>
  </label>
  <button class="btn sm" id="btnReset" type="button">Làm lại từ đầu</button>
  <a href="kiem-ke-theo-vung-phan-tich.html">Trang phân tích</a>
</div>
<div class="shell">
  <aside>
    <div class="brand">Fastlink ERP · CCDC</div>
    <div class="grp">Tài sản</div>
    <a data-go="ccdc">Công cụ dụng cụ <span class="badge" id="bdgPl" hidden></span></a>
    <div class="grp">Kiểm kê</div>
    <a data-go="dot">Đợt kiểm kê</a>
    <a data-go="cuatoi">Kiểm kê của tôi <span class="badge" id="bdgToi" hidden></span></a>
    <a data-go="phieu">Phiếu duyệt của tôi <span class="badge" id="bdgPhieu" hidden></span></a>
    <a data-go="bc">Báo cáo kiểm kê</a>
  </aside>
  <div>
    <div class="mnav"><select class="input" id="mnav" aria-label="Menu">
      <option value="ccdc">Công cụ dụng cụ</option><option value="dot">Đợt kiểm kê</option>
      <option value="cuatoi">Kiểm kê của tôi</option><option value="phieu">Phiếu duyệt của tôi</option><option value="bc">Báo cáo kiểm kê</option>
    </select></div>
    <main id="main"></main>
  </div>
</div>
<div class="overlay" id="ov"><div class="dlg" role="dialog" aria-modal="true">
  <header><h2 id="dTitle"></h2><button class="x" data-act="dong-dlg" aria-label="Đóng">×</button></header>
  <div class="body" id="dBody"></div>
  <footer id="dFoot"></footer>
</div></div>
<div class="toast" id="toast" hidden></div>

<script>
// ---------------- dữ liệu giả ----------------
const CTY = { VN01: 'Fastlink MB (VN01)', VN02: 'Fastlink MN (VN02)' };
const NHOM_GOC = { 'NTS-01': 'Thiết bị văn phòng', 'NTS-02': 'Thiết bị CNTT', 'NTS-03': 'Nội thất' };
// người quản lý chính của nhóm CCDC theo công ty; VN02 chưa có người cho NTS-01 (giống dữ liệu thật)
const QL = { VN01: { 'NTS-01': 'lan', 'NTS-02': 'hung', 'NTS-03': 'quan' }, VN02: { 'NTS-02': 'phong', 'NTS-03': 'tam' } };
const NGUOI = {
  thu: { ten: 'chị Thu', vai: 'Hành chính', cty: 'VN01' },
  lan: { ten: 'chị Lan', vai: 'QL nhóm Thiết bị văn phòng · VN01', cty: 'VN01' },
  hung: { ten: 'anh Hùng', vai: 'QL nhóm Thiết bị CNTT · VN01', cty: 'VN01' },
  quan: { ten: 'anh Quân', vai: 'QL nhóm Nội thất · VN01', cty: 'VN01' },
  phong: { ten: 'anh Phong', vai: 'QL nhóm Thiết bị CNTT · VN02', cty: 'VN02' },
  tam: { ten: 'anh Tâm', vai: 'QL nhóm Nội thất · VN02', cty: 'VN02' },
  minh: { ten: 'anh Minh', vai: 'Nhân viên · VN01', cty: 'VN01' },
  ha: { ten: 'chị Hà', vai: 'Nhân viên · VN01', cty: 'VN01' },
  son: { ten: 'anh Sơn', vai: 'Nhân viên · VN01', cty: 'VN01' },
  ngan: { ten: 'chị Ngân', vai: 'Nhân viên · VN02', cty: 'VN02' },
};
const VUNG = {
  KHO_MB: { ten: 'Kho MB (tầng 2)', cty: 'VN01', kho: true }, T3_CNTT: { ten: 'Tầng 3 · Phòng CNTT', cty: 'VN01' },
  T4_HOP: { ten: 'Tầng 4 · Phòng họp lớn', cty: 'VN01' }, T5_TGD: { ten: 'Tầng 5 · Phòng TGĐ', cty: 'VN01' },
  HOP_NHO: { ten: 'Tầng 5 · Phòng họp nhỏ', cty: 'VN01' },
  KHO_MN: { ten: 'Kho MN', cty: 'VN02', kho: true }, T8A: { ten: 'Tầng 8A · Văn phòng MN', cty: 'VN02' },
};
const TS0 = [
  ['TSHN0001', 'Laptop Dell 5420', 'NTS-02', 'VN01', 'rieng', 'minh', ''],
  ['TSHN0002', 'Màn hình Dell 24"', 'NTS-02', 'VN01', 'rieng', 'minh', ''],
  ['TSHN0003', 'Máy in HP M404', 'NTS-02', 'VN01', 'chung', '', 'T3_CNTT'],
  ['TSHN0004', 'Bàn làm việc 1m4', 'NTS-03', 'VN01', 'chung', '', 'T3_CNTT'],
  ['TSHN0005', 'Ghế xoay lưng lưới', 'NTS-03', 'VN01', 'chung', '', 'T3_CNTT'],
  ['TSHN0006', 'Máy chiếu Epson', 'NTS-01', 'VN01', 'chung', '', 'T4_HOP'],
  ['TSHN0007', 'Bàn họp 3m', 'NTS-03', 'VN01', 'chung', '', 'T4_HOP'],
  ['TSHN0008', 'Điều hoà Daikin', 'NTS-01', 'VN01', 'chung', '', 'T4_HOP'],
  ['TSHN0009', 'Tủ hồ sơ 4 ngăn', 'NTS-03', 'VN01', 'chung', '', 'T5_TGD'],
  ['TSHN0010', 'Laptop Lenovo T14', 'NTS-02', 'VN01', 'rieng', 'ha', ''],
  ['TSHN0011', 'Điện thoại bàn', 'NTS-01', 'VN01', 'chung', '', 'T5_TGD'],
  ['TSHN0012', 'Máy huỷ giấy', 'NTS-01', 'VN01', 'chung', '', 'KHO_MB'],
  ['TSHN0013', 'Bộ bàn phím chuột', 'NTS-02', 'VN01', 'chung', '', 'KHO_MB'],
  ['TSHN0014', 'Ổ cứng gắn ngoài 2TB', 'NTS-02', 'VN01', 'rieng', 'son', ''],
  ['TSHN0015', 'Quạt cây', 'NTS-01', 'VN01', 'chung', '', 'KHO_MB'],
  ['TSHN0016', 'Camera hội nghị', 'NTS-02', 'VN01', 'chung', '', 'T4_HOP'],
  ['TSHN0017', 'Máy tính bảng', 'NTS-02', 'VN01', 'rieng', 'ha', ''],
  ['TSHN0018', 'Laptop HP 840', 'NTS-02', 'VN02', 'rieng', 'ngan', ''],
  ['TSHN0019', 'Bàn làm việc 1m2', 'NTS-03', 'VN02', 'chung', '', 'T8A'],
  ['TSHN0020', 'Máy in Canon', 'NTS-02', 'VN02', 'chung', '', 'T8A'],
  ['TSHN0021', 'Tủ lạnh mini', 'NTS-01', 'VN02', 'chung', '', 'KHO_MN'],
  ['TSHN0022', 'Ghế phòng chờ', 'NTS-03', 'VN02', '', '', 'T8A'],
  ['TSHN0023', 'Máy lọc nước', 'NTS-01', 'VN02', 'chung', '', 'T4_HOP'],
  ['TSHN0024', 'Màn hình LG 27"', 'NTS-02', 'VN01', 'chung', '', 'T8A'],
];
const GOI_Y = [ // mã gợi ý để thử ở màn kiểm vùng
  ['TSHN0006', 'chung, đúng vùng'], ['TSHN0016', 'chung, đúng vùng'], ['TSHN0010', 'đồ riêng'],
  ['TSHN0023', 'khác công ty'], ['TSHN0003', 'đã ở vùng khác'], ['TSHN9999', 'không có trên hệ'],
];

let S;
function batDau() {
  const TS = {};
  TS0.forEach(([ma, ten, goc, cty, loai, giu, vung]) => TS[ma] = { ma, ten, goc, nhom: goc + '-0' + (1 + ma.charCodeAt(7) % 9) + '-001', cty, loai, giu, vung });
  S = {
    vai: 'thu', view: 'ccdc', dot: null, vung: null, nv: null, phieu: null, tab: 'vung',
    ccdc: { loai: '', cty: '', chon: new Set() }, bc: { dot: ['KK0013'], loai: '', bcTab: 'tq' }, seq: 3, seqDot: 13,
    TS,
    dots: [{ id: 'KK0013', cty: 'VN01', ten: 'Kiểm kê cuối năm 2026 · VN01', tao: '18/11/2026', mo: true,
      vung: {
        KHO_MB: { tt: 'dang', nguoi: 'thu', mon: [m('TSHN0012'), m('TSHN0013')] },
        T3_CNTT: { tt: 'chot', nguoi: 'thu', chot: '19/11 10:42', mon: [m('TSHN0003'), m('TSHN0004'), m('TSHN0005'), m('TSHN0014', [{ loai: 'rieng', nd: 'Đồ riêng của anh Sơn' }])] },
        T4_HOP: { tt: 'chua', mon: [] }, T5_TGD: { tt: 'chua', mon: [] },
        HOP_NHO: { tt: 'chot', nguoi: 'thu', chot: '19/11 11:05', mon: [] },
      },
      nv: { minh: { tt: 'xn', kq: { TSHN0001: 'co', TSHN0002: 'co' } }, ha: { tt: 'chua', kq: {} }, son: { tt: 'chua', kq: {} } } }],
    phieu: [
      { id: 'XN0001', dot: 'KK0013', loai: 'vung', vung: 'T3_CNTT', ai: 'hung', mon: ['TSHN0003', 'TSHN0014'], tt: 'cho', bo: {} },
      { id: 'XN0002', dot: 'KK0013', loai: 'vung', vung: 'T3_CNTT', ai: 'quan', mon: ['TSHN0004', 'TSHN0005'], tt: 'xn', bo: {}, luc: '19/11 14:20' },
      { id: 'XN0003', dot: 'KK0013', loai: 'nv', ai: 'minh', mon: ['TSHN0001', 'TSHN0002'], tt: 'xn', bo: {}, luc: '19/11 09:15' },
    ],
    vet: [{ dot: 'KK0013', ma: 'TSHN0014', vung: 'T3_CNTT', loai: 'rieng', nd: 'Đồ riêng của anh Sơn', nguoi: 'thu', luc: '19/11 10:31' }],
  };
  function m(ma, cb) { return { ma, cb: cb || [], nguoi: 'thu', luc: '19/11' }; }
}

// ---------------- tiện ích ----------------
const $ = id => document.getElementById(id);
const ten = id => (NGUOI[id] || {}).ten || id;
const gio = () => { const d = new Date(); return d.getDate() + '/' + (d.getMonth() + 1) + ' ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); };
const dotById = id => S.dots.find(d => d.id === id);
const qlCua = ts => (QL[ts.cty] || {})[ts.goc] || null;
const LOAI = { chung: '<span class="pill p-info">Chung</span>', rieng: '<span class="pill p-ok">Riêng</span>', '': '<span class="pill p-warn">Chưa phân loại</span>' };
const CB = { rieng: 'Đồ riêng', cty: 'Khác công ty', vung: 'Ở vùng khác' };
function toast(t) { const e = $('toast'); e.textContent = t; e.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => e.hidden = true, 2600); }
function dlg(title, body, foot) { $('dTitle').textContent = title; $('dBody').innerHTML = body; $('dFoot').innerHTML = foot; $('ov').classList.add('open'); }
function dongDlg() { $('ov').classList.remove('open'); }
function vungCuaMonTrongDot(d, ma, tru) { return Object.keys(d.vung).find(z => z !== tru && d.vung[z].mon.some(x => x.ma === ma)); }
function rieng(nv, cty) { return Object.values(S.TS).filter(t => t.loai === 'rieng' && t.giu === nv && t.cty === cty); }
function phieuCho(ai) { return S.phieu.filter(p => p.ai === ai && p.tt === 'cho'); }
function dotCuaToi(nv) { return S.dots.filter(d => d.mo && d.nv[nv]); }

// ---------------- điều hướng ----------------
function ve() {

// ---------------- Công cụ dụng cụ ----------------

  </div>

  </tbody></table></div><div class="foot">${ds.length} món · Đồ riêng phải có người giữ. Vùng cập nhật khi người quản lý xác nhận phiếu kiểm kê (đề xuất câu 1).</div></div>`;

// ---------------- Đợt kiểm kê ----------------

  return { vChot: zs.filter(z => z.tt === 'chot').length, vTong: zs.length, nXn: nvs.filter(n => n.tt === 'xn').length, nTong: nvs.length,
    pXn: ps.filter(p => p.tt === 'xn').length, pTong: ps.length, mon: zs.reduce((s, z) => s + z.mon.length, 0) };
}
function bar(a, b) { return `<span class="bar"><i style="width:${b ? Math.round(a * 100 / b) : 0}%"></i></span>${a}/${b}`; }
function veDot() {
  const hc = S.vai === 'thu';
  return `<div class="crumb">Kiểm kê › Đợt kiểm kê</div>

  ${S.dots.map(d => { const t = tienDo(d); return `<tr class="click" data-act="mo-dot" data-dot="${d.id}"><td class="mono">${d.id}</td><td>${d.ten}</td><td>${d.cty}</td><td>${bar(t.vChot, t.vTong)}</td><td>${bar(t.nXn, t.nTong)}</td><td>${bar(t.pXn, t.pTong)}</td><td>${d.mo ? '<span class="pill p-info">Đang kiểm</span>' : '<span class="pill p-mute">Đã đóng</span>'}</td></tr>`; }).join('')}
  </tbody></table></div></div>`;
}
function moTaoDot() {
  dlg('Tạo đợt kiểm kê', `<div class="field"><span class="lbl">Công ty</span><select class="input" id="tdCty">${Object.keys(CTY).map(k => `<option value="${k}">${CTY[k]}</option>`).join('')}</select></div>

function xemTaoDot() {

  $('tdXem').innerHTML = (chua.length ? `<div class="alert bad">Còn ${chua.length} món ${cty} chưa phân loại Chung / Riêng (${chua.map(t => t.ma).join(', ')}). Phân loại xong mới tạo được đợt.</div>` : '')
    + (trung ? `<div class="alert bad">${cty} đang có đợt ${trung.id} chưa đóng.</div>` : '')

  $('tdOk').disabled = !!(chua.length || trung);
}
function taoDot() {
  const cty = $('tdCty').value, id = 'KK00' + (++S.seqDot);

  const nv = {}; Object.values(S.TS).filter(t => t.cty === cty && t.loai === 'rieng').forEach(t => nv[t.giu] = { tt: 'chua', kq: {} });

// ---------------- Chi tiết đợt ----------------

function ttVung(d, z) { const v = d.vung[z]; if (v.tt !== 'chot') return TT_VUNG[v.tt]; const n = S.phieu.filter(p => p.dot === d.id && p.vung === z).length; return `<span class="pill p-ok">Đã chốt · ${n ? n + ' phiếu' : 'vùng trống'}</span>`; }

   <div class="acts">${hc && d.mo ? '<button class="btn danger" data-act="dong-dot">Đóng đợt</button>' : ''}<button class="btn" data-act="bc-dot">Xem báo cáo</button></div></div>

  <div class="foot">${S.tab === 'vung' ? 'Mỗi vùng do một người hoặc một nhóm kiểm lần lượt. Vùng trống vẫn phải chốt, không sinh phiếu.' : S.tab === 'nv' ? 'Phần nhân viên chỉ có đồ Riêng. Đồ Chung đi theo vùng.' : 'Phiếu vùng: mỗi người quản lý nhóm CCDC một phiếu cho mỗi vùng.'}</div></div>`;

function dongDot() {

  dlg('Đóng đợt ' + d.id, `<p>Còn dở trong đợt:</p><ul><li>${t.vTong - t.vChot} vùng chưa chốt</li><li>${t.nTong - t.nXn} nhân viên chưa xác nhận</li><li>${t.pTong - t.pXn} phiếu chưa xác nhận</li></ul>

}

// ---------------- Kiểm vùng (màn app) ----------------
function veKiemVung() {
  const d = dotById(S.dot), v = d.vung[S.vung], sua = d.mo && v.tt !== 'chot';
  return `<div class="crumb"><a data-act="go" data-go="dot">Đợt kiểm kê</a> › <a data-act="mo-dot" data-dot="${d.id}">${d.id}</a> › Kiểm vùng</div>
  <div class="phone">
    <div class="ph-top"><div class="t">${VUNG[S.vung].ten}</div><div class="s">${d.id} · ${d.cty} · ${v.tt === 'chot' ? 'Đã chốt ' + v.chot : v.mon.length ? 'Đang kiểm · đã lưu ' + v.mon.length + ' món' : 'Chưa có món nào'}</div></div>
    <div class="ph-body">
      ${sua ? `<div class="scan"><input class="input" id="scan" placeholder="Quét hoặc nhập mã tài sản" aria-label="Mã tài sản" autocomplete="off"><button class="btn primary" data-act="them">Thêm</button></div>

      ${v.mon.length ? '' : `<div class="alert info" style="margin-top:10px">${sua ? 'Danh sách vùng bắt đầu trắng. Thấy món nào thì quét món đó.' : 'Vùng trống, đã chốt không sinh phiếu.'}</div>`}
      <div id="dsMon">${v.mon.slice().reverse().map(x => { const t = S.TS[x.ma]; return `<div class="item"><div><div class="m mono">${t.ma}</div><div>${t.ten}</div><div class="d">${NHOM_GOC[t.goc]} · ${t.cty} · ${LOAI[t.loai]} ${x.cb.map(c => `<span class="pill p-warn">${CB[c.loai]}</span>`).join(' ')}</div></div>${sua ? `<button class="x" data-act="bo-mon" data-ma="${t.ma}" aria-label="Bỏ ${t.ma}">×</button>` : ''}</div>`; }).join('')}</div>
    </div>
    ${sua ? `<div class="ph-foot"><button class="btn" data-act="luu-thoat">Lưu và thoát</button><button class="btn ok" data-act="chot-vung">Chốt vùng</button></div>` : `<div class="ph-foot"><button class="btn" data-act="mo-dot" data-dot="${d.id}">Quay lại đợt</button></div>`}
  </div>`;
}
function them(ma) {
  ma = (ma || '').trim().toUpperCase(); if (!ma) return;
  const d = dotById(S.dot), v = d.vung[S.vung], t = S.TS[ma];
  if (!t) return toast('Không tìm thấy mã ' + ma + ' trên hệ thống.');
  if (v.mon.some(x => x.ma === ma)) return toast(ma + ' đã có trong vùng này.');
  const cb = [];
  if (t.loai === 'rieng') cb.push({ loai: 'rieng', nd: 'Đây là đồ riêng của ' + ten(t.giu) + '. Món vẫn nằm trong phần kiểm của ' + ten(t.giu) + '.' });
  if (t.cty !== d.cty) cb.push({ loai: 'cty', nd: 'Món này thuộc công ty ' + t.cty + ', đợt đang kiểm là ' + d.cty + '.' });
  const kia = vungCuaMonTrongDot(d, ma, S.vung);
  if (kia) cb.push({ loai: 'vung', nd: 'Món này đang được kiểm ở vùng ' + VUNG[kia].ten + ' trong cùng đợt.' });
  if (!cb.length) return ghiMon(ma, []);
  S.cho = { ma, cb };
  dlg('Cảnh báo · ' + ma, `<p><b>${t.ten}</b></p><ul class="wlist">${cb.map(c => `<li><b>${CB[c.loai]}:</b> ${c.nd}</li>`).join('')}</ul><p style="margin-top:10px">Có thêm vào vùng <b>${VUNG[S.vung].ten}</b> không? Nếu thêm, hệ thống lưu vết để báo cáo tìm lại được.</p>`,
    `<button class="btn" data-act="dong-dlg">Không thêm</button><button class="btn primary" data-act="them-ok">Vẫn thêm</button>`);
}
function ghiMon(ma, cb) {
  const d = dotById(S.dot), v = d.vung[S.vung];
  v.mon.push({ ma, cb, nguoi: S.vai, luc: gio() }); v.tt = 'dang'; v.nguoi = v.nguoi || S.vai;
  cb.forEach(c => S.vet.push({ dot: d.id, ma, vung: S.vung, loai: c.loai, nd: c.nd, nguoi: S.vai, luc: gio() }));

}
function nhomPhieu(d, z) {

function chotVung() {
